campaign: Run3_NanoAODv15
status: prototype
producer: FastSimNNScaleFactors
training_sample: pMSSM_334_105076
format: lwtnn_json
architecture: EffClassifier_4_32_32_4_ReLU_Softmax
inputs:
  - pt_log10
  - eta
  - phi
  - iso_log10
preprocessing:
  pt_log10: log10(max(gen_pt, 1e-4))
  iso_log10: log10(max(gen_iso, 1e-6))
outputs:
  p11: fast_matched=1, full_matched=1
  p10: fast_matched=1, full_matched=0
  p01: fast_matched=0, full_matched=1
  p00: fast_matched=0, full_matched=0
derived:
  eff_fast: p11 + p10
  eff_full: p11 + p01
  sf_full_over_fast: eff_full / eff_fast
validation:
  pytorch_lwtnn_summary: payload_validation_summary.txt
notes:
  - Payloads require correctionlib LWTNN-node support or standalone lwtnn evaluator.
  - Physics closure plots already exist separately and should be linked in release notes.
